name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # stdlib-only app: nothing to install
      - name: Compile all modules
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest -v test_bridge
      - name: Entrypoints import cleanly
        env:
          FULDC_PASS: dummy
          TORZNAB_APIKEY: dummy
        run: python -c "import webhook_server, arr_server, bridge, torznab, qbit, store, notify, plex, httputil"

  image:
    # The Dockerfile COPYs modules by name, so a new module that nobody added
    # to it breaks the container while every source-level check stays green.
    # That has already happened once; this is the guard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fuldc-arr-bridge:ci .
      - name: Webhook entrypoint starts in the image
        run: |
          docker run --rm -e FULDC_PASS=dummy fuldc-arr-bridge:ci \
            python -c "import webhook_server, bridge, notify, plex, httputil; print('webhook modules ok')"
      - name: Arr entrypoint starts in the image
        run: |
          docker run --rm -e FULDC_PASS=dummy -e TORZNAB_APIKEY=dummy fuldc-arr-bridge:ci \
            python -c "import arr_server, torznab, qbit, store, httputil; print('arr modules ok')"
