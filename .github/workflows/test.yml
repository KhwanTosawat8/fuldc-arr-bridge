name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # stdlib-only app: nothing to install
      - name: Compile all modules
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest -v test_bridge
      - name: Entrypoints import cleanly
        env:
          FULDC_PASS: dummy
          TORZNAB_APIKEY: dummy
        run: python -c "import webhook_server, arr_server, bridge, torznab, qbit, store, notify, plex"
