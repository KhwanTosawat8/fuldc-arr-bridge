apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuldc-bridge
  namespace: fuldc-bridge
  labels:
    app.kubernetes.io/name: fuldc-bridge
spec:
  replicas: 1
  # The release->magnet map and the tracked-download table are in-process, so
  # two pods behind one Service answer with different state: a Torznab search
  # served by pod A produces a magnet pod B has never heard of. Recreate keeps
  # a rollout from briefly running two.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fuldc-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fuldc-bridge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          image: ghcr.io/pete1979/fuldc-arr-bridge:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: FULDC_URL
              value: "http://192.168.0.22:5600"   # FulDC++ Web API host
            - name: FULDC_USER
              value: "admin"
            - name: FULDC_PASS
              valueFrom:
                secretKeyRef:
                  name: fuldc-bridge-secret   # kubectl create secret generic fuldc-bridge-secret --from-literal=FULDC_PASS=...
                  key: FULDC_PASS
            - name: DC_ROOT
              value: "S:\\dc"
            - name: MOVIES_ONLY
              value: "0"
            - name: PORT
              value: "8080"
            # Kept in step with docker-compose; all optional.
            - name: WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fuldc-bridge-secret
                  key: WEBHOOK_TOKEN
                  optional: true
            - name: QUALITY
              value: ""
            - name: MOVIES_DIR
              value: ""
            - name: SERIES_DIR
              value: ""
            - name: MEDIASERVER
              value: "none"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Readiness depends on FulDC++ actually answering; "/" always
          # returns 200, so probing it reports a pod healthy with FULDC_PASS
          # unset and the client unreachable. Liveness stays on "/" — a
          # liveness probe that depends on FulDC++ would restart this pod
          # every time the client restarts.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
