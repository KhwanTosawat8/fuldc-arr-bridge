services:
  fuldc-arr-bridge:
    image: ghcr.io/pete1979/fuldc-arr-bridge:latest
    container_name: fuldc-arr-bridge
    restart: unless-stopped
    ports:
      - "8080:8080"          # Seerr posts its webhook here
    environment:
      # FulDC++ Web API. On the same Windows PC as FulDC++ (Docker Desktop),
      # use host.docker.internal. Otherwise use the LAN IP, e.g. http://192.168.0.22:5600
      FULDC_URL: "${FULDC_URL:-http://host.docker.internal:5600}"
      FULDC_USER: "${FULDC_USER:-admin}"
      FULDC_PASS: "${FULDC_PASS:?set FULDC_PASS in .env}"
      # YOUR DC share root on the FulDC++ host, as a Windows path (REQUIRED).
      # This is whatever drive/folder your FulDC++ shares from, e.g. S:\dc,
      # D:\Media, E:\Shares\DC ... The bridge saves into:
      #   movies -> DC_ROOT\movies\ ; series -> DC_ROOT\series\<Show>\S<NN>\
      DC_ROOT: "${DC_ROOT:?set DC_ROOT in .env to your DC share root, e.g. S:\\dc}"
      # Optional: override the movie/TV folders directly for non-standard
      # layouts (take precedence over DC_ROOT). Full Windows paths.
      MOVIES_DIR: "${MOVIES_DIR:-}"
      SERIES_DIR: "${SERIES_DIR:-}"
      # "1" = only handle movie requests, "0" = movies + TV
      MOVIES_ONLY: "${MOVIES_ONLY:-0}"
      # Optional quality filter, e.g. 1080p. Movies: only that quality is grabbed.
      # TV: baked into the %[inc] episode monitor. Blank = any quality.
      QUALITY: "${QUALITY:-}"
      # Optional shared secret. If set, Seerr's webhook URL must carry it:
      # http://<host>:8080/?token=<value>  (or an X-Webhook-Token header).
      # Leave blank only if this port is strictly LAN-internal — anyone who can
      # reach it can queue downloads.
      WEBHOOK_TOKEN: "${WEBHOOK_TOKEN:-}"
      # Optional post-download library refresh: plex | jellyfin | webhook | none
      MEDIASERVER: "${MEDIASERVER:-none}"
      PLEX_URL: "${PLEX_URL:-}"
      PLEX_TOKEN: "${PLEX_TOKEN:-}"
      PLEX_MOVIES_SECTION: "${PLEX_MOVIES_SECTION:-Movies}"
      PLEX_SERIES_SECTION: "${PLEX_SERIES_SECTION:-TV Shows}"
      JELLYFIN_URL: "${JELLYFIN_URL:-}"
      JELLYFIN_TOKEN: "${JELLYFIN_TOKEN:-}"
      NOTIFY_WEBHOOK: "${NOTIFY_WEBHOOK:-}"
      PORT: "8080"
    # host.docker.internal is built in on Docker Desktop (Windows/macOS).
    # On Linux this line makes it resolve to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # EXPERIMENTAL: full Radarr/Sonarr integration (Torznab indexer + qBittorrent
  # shim). Not needed for the Seerr flow above. Enable with:
  #     docker compose --profile arr up -d
  # Then in Radarr/Sonarr add a Generic Torznab indexer (URL
  # http://<host>:9117/torznab, API key = TORZNAB_APIKEY) and a qBittorrent
  # download client (host <host>, port 9117).
  # ---------------------------------------------------------------------------
  fuldc-arr:
    image: ghcr.io/pete1979/fuldc-arr-bridge:latest
    container_name: fuldc-arr
    profiles: ["arr"]
    command: ["python", "arr_server.py"]
    restart: unless-stopped
    ports:
      - "9117:9117"
    environment:
      FULDC_URL: "${FULDC_URL:-http://host.docker.internal:5600}"
      FULDC_USER: "${FULDC_USER:-admin}"
      FULDC_PASS: "${FULDC_PASS:?set FULDC_PASS in .env}"
      DC_ROOT: "${DC_ROOT:?set DC_ROOT in .env}"
      MOVIES_DIR: "${MOVIES_DIR:-}"
      SERIES_DIR: "${SERIES_DIR:-}"
      # Required — same value goes in the Radarr/Sonarr indexer config.
      TORZNAB_APIKEY: "${TORZNAB_APIKEY:?set TORZNAB_APIKEY in .env}"
      # Credentials for the qBittorrent-compatible download client. Blank =
      # anyone who can reach :9117 can queue downloads.
      QBIT_USER: "${QBIT_USER:-}"
      QBIT_PASS: "${QBIT_PASS:-}"
      ARR_PORT: "9117"
    extra_hosts:
      - "host.docker.internal:host-gateway"
